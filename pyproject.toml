[project]
name = "niepy"
version = "0.1.0"
description = "Porte d'entrée Python vers le moteur et les données de nie (Inazuma Eleven: Victory Road) — VFS, décodeurs de formats, simulation de match, pont Ren'Py."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Aucune dépendance d'exécution : tout le travail est fait par la bibliothèque native
# `nie_ffi`, atteinte par `ctypes` (stdlib). C'est délibéré — Ren'Py embarque son propre
# Python, où installer des roues tierces est une source d'ennuis sans fin.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["niepy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
